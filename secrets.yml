# ---------------------------------------
# SECRETS REQUERIDOS EN GITHUB ACTIONS
# ---------------------------------------
#


secrets:
  # -----------------------------------------------------------
  # AWS ACADEMY — Credenciales de acceso temporal
  # Se renuevan cada vez que inicias sesión en AWS Academy.
  # Debes actualizarlas manualmente en GitHub cada sesión.
  # -----------------------------------------------------------

  AWS_ACCESS_KEY_ID:
    descripcion: >
      Clave de acceso temporal generada por AWS Academy Learner Lab.
      Se obtiene desde: AWS Academy → Launch AWS Learner Lab →
      AWS Details → AWS CLI → aws_access_key_id
    tipo: string
    ejemplo: "ASIA..."
    obligatorio: true
    usado_en:
      - .github/workflows/ci-cd-backend-despachos.yml
      - .github/workflows/ci-cd-backend-ventas.yml
      - .github/workflows/ci-cd-frontend.yml

  AWS_SECRET_ACCESS_KEY:
    descripcion: >
      Clave secreta temporal generada por AWS Academy Learner Lab.
      Se obtiene desde: AWS Academy → Launch AWS Learner Lab →
      AWS Details → AWS CLI → aws_secret_access_key
    tipo: string
    ejemplo: "wJalrXUtnFEMI/..."
    obligatorio: true
    usado_en:
      - .github/workflows/ci-cd-backend-despachos.yml
      - .github/workflows/ci-cd-backend-ventas.yml
      - .github/workflows/ci-cd-frontend.yml

  AWS_SESSION_TOKEN:
    descripcion: >
      Token de sesión temporal requerido por AWS Academy (STS).
      A diferencia de cuentas normales AWS, Academy usa credenciales
      federadas que siempre requieren session token.
      Se obtiene desde: AWS Academy → Launch AWS Learner Lab →
      AWS Details → AWS CLI → aws_session_token
    tipo: string
    ejemplo: "IQoJb3JpZ2luX2VjE..."
    obligatorio: true
    nota: >
      Este secret es exclusivo de AWS Academy. En cuentas AWS
      estándar con IAM Users no se requiere.
    usado_en:
      - .github/workflows/ci-cd-backend-despachos.yml
      - .github/workflows/ci-cd-backend-ventas.yml
      - .github/workflows/ci-cd-frontend.yml

  # -----------------------------------------------------------
  # AMAZON ECR — URIs de los repositorios de imágenes Docker
  # Formato: <account_id>.dkr.ecr.<region>.amazonaws.com/<nombre>
  # -----------------------------------------------------------

  ECR_REPO_FRONTEND:
    descripcion: >
      URI completo del repositorio ECR para la imagen del Frontend.
      Se obtiene desde: AWS Console → ECR → Repositories → frontend
    tipo: string
    ejemplo: "123456789012.dkr.ecr.us-east-1.amazonaws.com/innovatech/frontend-despacho"
    obligatorio: true
    usado_en:
      - .github/workflows/ci-cd-frontend.yml

  ECR_REPO_BACKEND_DESPACHOS:
    descripcion: >
      URI completo del repositorio ECR para la imagen del Backend de Despachos.
      Se obtiene desde: AWS Console → ECR → Repositories → backend-despachos
    tipo: string
    ejemplo: "123456789012.dkr.ecr.us-east-1.amazonaws.com/innovatech/backend-despachos"
    obligatorio: true
    usado_en:
      - .github/workflows/ci-cd-backend-despachos.yml

  ECR_REPO_BACKEND_VENTAS:
    descripcion: >
      URI completo del repositorio ECR para la imagen del Backend de Ventas.
      Se obtiene desde: AWS Console → ECR → Repositories → backend-ventas
    tipo: string
    ejemplo: "123456789012.dkr.ecr.us-east-1.amazonaws.com/innovatech/backend-ventas"
    obligatorio: true
    usado_en:
      - .github/workflows/ci-cd-backend-ventas.yml

# =============================================================
# CÓMO ACTUALIZAR LOS SECRETS EN CADA SESIÓN AWS ACADEMY
# =============================================================
#
# 1. Inicia tu Learner Lab en AWS Academy
# 2. Haz clic en "AWS Details" → "AWS CLI"
# 3. Copia los tres valores: access key, secret key, session token
# 4. Ve a tu repo en GitHub:
#    Settings → Secrets and variables → Actions
# 5. Actualiza los secrets:
#    - AWS_ACCESS_KEY_ID
#    - AWS_SECRET_ACCESS_KEY
#    - AWS_SESSION_TOKEN
#
# Los secrets ECR_REPO_* no cambian entre sesiones.
#
# =============================================================
# BUENAS PRÁCTICAS APLICADAS
# =============================================================
#
# ✔ Ningún valor real está hardcodeado en el código fuente
# ✔ El archivo .env no se sube al repositorio (ver .gitignore)
# ✔ Se usa .env.example para documentar las variables sin valores
# ✔ Los secrets se inyectan solo en tiempo de ejecución del pipeline
# ✔ GitHub cifra los secrets en reposo y en tránsito
# ✔ Los secrets nunca aparecen en los logs de GitHub Actions
# ✔ AWS Academy usa credenciales temporales STS (más seguras)
#
# =============================================================
# USO EN GITHUB ACTIONS (referencia)
# =============================================================
#
# env:
#   AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
#   AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
#   AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}
#   ECR_REPO:              ${{ secrets.ECR_REPO_FRONTEND }}
#
# =============================================================