server {
    listen 80;

    # Sirve el frontend React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy al microservicio de Ventas (Service K8s: backend-ventas:8080)
    location /api/ventas/ {
        rewrite ^/api/ventas/(.*)$ /api/$1 break;
        proxy_pass http://backend-ventas:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy al microservicio de Despachos (Service K8s: backend-despachos:8081)
    location /api/despachos/ {
        rewrite ^/api/despachos/(.*)$ /api/$1 break;
        proxy_pass http://backend-despachos:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
