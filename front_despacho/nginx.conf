server {
    listen 80;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Microservicio de Ventas — usa nombre de servicio Docker, no localhost
    location /api/ventas/ {
        rewrite ^/api/ventas/(.*)$ /api/$1 break;
        proxy_pass http://backend-ventas:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Microservicio de Despachos — usa nombre de servicio Docker, no localhost
    location /api/despachos/ {
        rewrite ^/api/despachos/(.*)$ /api/$1 break;
        proxy_pass http://backend-despachos:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
