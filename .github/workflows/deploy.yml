name: CI/CD — Innovatech Despachos

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push Frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/${{ secrets.ECR_REPO_FRONTEND }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ secrets.ECR_REPO_FRONTEND }}:latest \
            ./front_despacho
          docker push $ECR_REGISTRY/${{ secrets.ECR_REPO_FRONTEND }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ secrets.ECR_REPO_FRONTEND }}:latest

      - name: Build y push Backend Despachos
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/${{ secrets.ECR_REPO_BACKEND }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ secrets.ECR_REPO_BACKEND }}:latest \
            ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $ECR_REGISTRY/${{ secrets.ECR_REPO_BACKEND }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ secrets.ECR_REPO_BACKEND }}:latest

  # Este job solo corre si build-and-push fue exitoso
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # EC2 pública: solo corre el contenedor nginx del frontend
      - name: Deploy Frontend en EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/${{ secrets.ECR_REPO_FRONTEND }}:latest

            docker stop frontend 2>/dev/null || true
            docker rm   frontend 2>/dev/null || true

            docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 80:80 \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/${{ secrets.ECR_REPO_FRONTEND }}:latest

      # EC2 privada: backend con variables de entorno inyectadas desde secrets
      - name: Deploy Backend en EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/${{ secrets.ECR_REPO_BACKEND }}:latest

            docker stop backend 2>/dev/null || true
            docker rm   backend 2>/dev/null || true

            docker run -d \
              --name backend \
              --restart unless-stopped \
              -p 8081:8081 \
              -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} \
              -e DB_PORT=${{ secrets.DB_PORT }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/${{ secrets.ECR_REPO_BACKEND }}:latest