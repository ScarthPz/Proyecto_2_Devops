name: CD Pipeline

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push Frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/${{ secrets.ECR_REPO_FRONTEND }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ secrets.ECR_REPO_FRONTEND }}:latest \
            ./front_despacho
          docker push $ECR_REGISTRY/${{ secrets.ECR_REPO_FRONTEND }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ secrets.ECR_REPO_FRONTEND }}:latest

      - name: Build y push Backend Ventas
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/${{ secrets.ECR_REPO_BACKEND_VENTAS }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ secrets.ECR_REPO_BACKEND_VENTAS }}:latest \
            ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push $ECR_REGISTRY/${{ secrets.ECR_REPO_BACKEND_VENTAS }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ secrets.ECR_REPO_BACKEND_VENTAS }}:latest

      - name: Build y push Backend Despachos
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/${{ secrets.ECR_REPO_BACKEND_DESPACHOS }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ secrets.ECR_REPO_BACKEND_DESPACHOS }}:latest \
            ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $ECR_REGISTRY/${{ secrets.ECR_REPO_BACKEND_DESPACHOS }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ secrets.ECR_REPO_BACKEND_DESPACHOS }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy en ECS
        run: |
          aws ecs update-service \
            --cluster devops-e2-cluster \
            --service app \
            --force-new-deployment \
            --no-cli-pager