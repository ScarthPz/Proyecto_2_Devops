name: CI Pipeline

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  # Frontend 
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front_despacho
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front_despacho/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Construir aplicación
        run: npm run build

      - name: Verificar build generado
        run: ls -la dist/

  # Backend Despachos
  backend-despachos-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build y tests
        run: mvn clean install

  # Backend Ventas 
  backend-ventas-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-Ventas_SpringBoot/Springboot-API-REST
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build y tests
        run: mvn clean install
