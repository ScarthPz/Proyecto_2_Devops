services:
  db:
    image: mysql:8.0
    container_name: db-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE_VENTAS}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
      dockerfile: Dockerfile
    container_name: backend-ventas
    ports:
      - "8080:8080"
    environment:
      - DB_ENDPOINT=db
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE_VENTAS}
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
    depends_on:
      - db


  backend-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      dockerfile: Dockerfile
    container_name: backend-despachos
    ports:
      - "8081:8081"
    environment:
      - DB_ENDPOINT=db
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE_DESPACHOS}
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
    depends_on:
      - db


  frontend:
    build:
      context: ./front_despacho
      dockerfile: Dockerfile
    container_name: frontend-despacho
    ports:
      - "3000:80"
    depends_on:
      - backend-ventas
      - backend-despachos

volumes:
  mysql_data:
