# =============================================================
# Backend Ventas — Deployment + Service
# Imagen obtenida desde Amazon ECR.
# Credenciales de DB leídas desde el Secret "db-credentials".
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ventas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-ventas
  template:
    metadata:
      labels:
        app: backend-ventas
    spec:
      containers:
        - name: backend-ventas
          # Imagen base que el pipeline CD reemplaza con la URL ECR real:
          # ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/backend_ventas:SHA
          image: placeholder/backend_ventas:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_ENDPOINT
              value: mysql-ventas
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: ventas_db
            # Credenciales leídas desde Kubernetes Secret (no hardcodeadas)
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: backend-ventas
spec:
  selector:
    app: backend-ventas
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP