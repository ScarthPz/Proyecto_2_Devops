# =============================================================
# MySQL Ventas — Deployment + Service
# Contraseña root leída desde el Secret "db-credentials".
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-ventas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-ventas
  template:
    metadata:
      labels:
        app: mysql-ventas
    spec:
      containers:
        - name: mysql-ventas
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            # Contraseña leída desde Kubernetes Secret (no hardcodeada)
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: ventas_db
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-ventas
spec:
  selector:
    app: mysql-ventas
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP