# =============================================================
# Kubernetes Secret — Credenciales de base de datos
# Las credenciales se almacenan en base64
#
# Para regenerar los valores base64:
#   echo -n "tu_password" | base64
#
# Valor actual: "root" en base64 = "cm9vdA=="
# 
# =============================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
data:
  # echo -n "root" | base64
  DB_USERNAME: cm9vdA==
  # echo -n "root" | base64
  DB_PASSWORD: cm9vdA==
  # echo -n "root" | base64
  MYSQL_ROOT_PASSWORD: cm9vdA==