# =============================================================
# Backend Despachos — Deployment + Service
# Imagen obtenida desde Amazon ECR.
# Credenciales de DB leídas desde el Secret "db-credentials".
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-despachos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-despachos
  template:
    metadata:
      labels:
        app: backend-despachos
    spec:
      containers:
        - name: backend-despachos
          # Imagen base que el pipeline CD reemplaza con la URL ECR real:
          # ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/backend_despachos:SHA
          image: placeholder/backend_despachos:latest
          ports:
            - containerPort: 8081
          env:
            - name: DB_ENDPOINT
              value: mysql-despachos
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: despacho_db
            # Credenciales leídas desde Kubernetes Secret (no hardcodeadas)
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: backend-despachos
spec:
  selector:
    app: backend-despachos
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP