# =============================================================
# Frontend — Deployment + Service
# Imagen obtenida desde Amazon ECR (no imagen local).
# La URL ECR se inyecta durante el pipeline CD con:
#   kubectl set image deployment/frontend frontend=<ECR_URL>:<TAG>
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Imagen base que el pipeline CD reemplaza con la URL ECR real:
          # ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/frontend_despacho:SHA
          image: placeholder/frontend_despacho:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer