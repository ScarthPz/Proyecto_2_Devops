# =============================================================
# MySQL Despachos — Deployment + Service
# Contraseña root leída desde el Secret "db-credentials".
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-despachos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-despachos
  template:
    metadata:
      labels:
        app: mysql-despachos
    spec:
      containers:
        - name: mysql-despachos
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            # Contraseña leída desde Kubernetes Secret (no hardcodeada)
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: despacho_db
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-despachos
spec:
  selector:
    app: mysql-despachos
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP